<!-- Support for Font Awesome -->
 <link rel="preload" href="{{ base_path }}/assets/css/fontawesome.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="{{ base_path }}/assets/css/fontawesome.css"></noscript>

<!-- Bilingual (English / 中文) support.
     Mark any element with class "i18n-en" or "i18n-zh"; only the elements of the
     currently selected language are shown. The language lives on <html data-lang>,
     is set here before first paint (no flash), and is toggled from the masthead. -->
<style>
  html[data-lang="en"] .i18n-zh,
  html[data-lang="zh"] .i18n-en,
  html:not([data-lang]) .i18n-zh { display: none !important; }
</style>
<script>
  (function () {
    /* English is the default for first-time visitors, whatever their browser
       locale; only a previous explicit choice switches the page to Chinese.
       Note: the compress layout strips newlines inside <script>, so every
       comment in here must be a block comment, never //. */
    var lang;
    try { lang = window.localStorage.getItem("site-lang"); } catch (e) { /* storage blocked */ }
    if (lang !== "zh") { lang = "en"; }
    document.documentElement.setAttribute("data-lang", lang);
    document.documentElement.lang = (lang === "zh") ? "zh-CN" : "en";
  })();
</script>
